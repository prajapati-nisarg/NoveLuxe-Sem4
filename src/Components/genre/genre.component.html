<div class="genre-container">
    <div class="genre-header">
        <h1>Browse by Genre</h1>
        <div class="genre-selector">
            <mat-form-field appearance="fill">
                <mat-label>Select Genre</mat-label>
                <mat-select [(value)]="selectedGenre" (selectionChange)="onGenreChange($event)">
                    <mat-option *ngFor="let genre of genres" [value]="genre">{{ genre }}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    </div>

    <div class="genre-results">
        <div class="current-genre">
            <h2>{{ selectedGenre }}</h2>
            <div class="genre-divider"></div>
        </div>

        <div class="novels-list">
            <div *ngFor="let nov of novels" class="novel-item">
                <div class="novel-card">
                    <div class="novel-image">
                        <img [src]="'assets/' + nov.folderName + '.jpg'" alt="{{ nov.title }}" class="cover-image">
                    </div>

                    <div class="novel-details">
                        <h3 class="novel-title" (click)="goToDisp(nov.title)">{{ nov.title }}</h3>
                        <div class="novel-author">by {{ nov.author }}</div>

                        <div class="genre-tags">
                            <span class="genre-tag">{{ nov.genre }}</span>
                        </div>

                        <p class="novel-description">{{ nov.description }}</p>

                        <div class="novel-stats">
                            <div class="stat-item">
                                <span class="stat-icon">📅</span>
                                <span class="stat-text">{{ nov.publishDate }}</span>
                            </div>
                            <div class="stat-item">
                                <span class="star-icon">★</span>
                                <span class="stat-text">Rating :  {{ nov.rating }}</span>
                            </div>
                        </div>

                        <button class="read-novel-btn" (click)="goToDisp(nov.title)">
                            Read Now
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div *ngIf="novels.length === 0" class="no-results">
            <div class="empty-state">
                <div class="empty-icon">📚</div>
                <h3>No novels found</h3>
                <p>Try selecting a different genre</p>
            </div>
        </div>
    </div>
</div>
